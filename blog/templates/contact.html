{% extends 'base.html' %}

{% block title %}
Contact - CATABLOG
{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height: 100vh; padding-top: 70px;">
  <div class="container text-center">
    <h1 class="text-center">Contact Us</h1>
    <hr class="my-4" style="border: 1px solid #ccc; width: 60%; margin: 0 auto;">
    <p class="text-center">We'd love to hear from you! Please fill out the form below.</p>
    <hr class="mb-4">

    <!-- Alert messages -->
    {% if messages %}
    <div class="alert-container">
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <form method="post" action="{% url 'contact' %}" class="mx-auto" style="max-width: 600px;">
      {% csrf_token %}
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="first_name">First Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="first_name" name="first_name" required>
        </div>
        <div class="col-md-6 mb-3">
          <label for="last_name">Last Name</label>
          <input type="text" class="form-control" id="last_name" name="last_name">
        </div>
      </div>
      <div class="mb-3">
        <label for="email">Email <span class="text-danger">*</span></label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="mb-3">
        <label for="subject">Subject <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="subject" name="subject" required>
      </div>
      <div class="mb-3">
        <label for="message">Message <span class="text-danger">*</span></label>
        <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Send</button>
    </form>
  </div>
</div>
{% endblock %}
