{% extends 'base.html' %}

{% block title %}
Register - CATABLOG
{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="container text-center" style="max-width: 400px;">
        <h1 class="text-center">Register</h1>
        <p class="text-center">Create your account to join CATABLOG.</p>
        <hr class="mb-4">

        <form method="post" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label white-text">Username</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label white-text">Email</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="password1" class="form-label white-text">Password</label>
                <input type="password" id="password1" name="password1" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="password2" class="form-label white-text">Confirm Password</label>
                <input type="password" id="password2" name="password2" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
    </div>
</div>
{% endblock %}
